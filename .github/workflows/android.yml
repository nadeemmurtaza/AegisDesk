name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :apps:android:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :apps:android:testDebugUnitTest --stacktrace

      # The Android capability adapter (platform-impl/android) implements the shared
      # PlatformCapabilities contract; assembleDebug compiles it and testDebugUnitTest
      # runs its JVM tests (file round-trip + bounded shell runner).
      - name: Build platform-impl:android adapter + run its unit tests
        run: ./gradlew :platform-impl:android:assembleDebug :platform-impl:android:testDebugUnitTest --stacktrace

      # The Windows capability adapter (platform-impl/windows) implements the same contract
      # on the JVM. Its unit tests run on any OS: Windows-only paths are guarded with
      # JUnit Assume or typed CapabilityResult failures (the Windows-only paths — DPAPI
      # secrets round-trip, Toolhelp32 process listing, Win32 app index — actually run on
      # the windows-adapter-tests job below).
      - name: Build platform-impl:windows adapter + run its unit tests
        run: ./gradlew :platform-impl:windows:test --stacktrace

  # The Windows-only adapter tests are Assume-gated on IS_WINDOWS, so the ubuntu
  # job above compiles them but skips the OS-bound paths. This Windows runner is
  # where those paths actually execute: DPAPI CryptProtectData/CryptUnprotectData
  # secrets round-trip and the Toolhelp32 process listing (Track A).
  windows-adapter-tests:
    name: Windows adapter tests (Windows-only paths)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # bash shell (Git Bash ships on windows-latest) so the POSIX gradlew wrapper
      # runs; Gradle on Windows resolves the JDK from setup-java.
      - name: Run platform-impl:windows adapter tests on Windows
        shell: bash
        run: ./gradlew :platform-impl:windows:test --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/android/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumented-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented DB migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: ./gradlew :apps:android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newax.aegis.db.MigrationTest --stacktrace
