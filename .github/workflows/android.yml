name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :apps:androidApp:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :apps:androidApp:testDebugUnitTest --stacktrace

      # The Android capability adapter (platform/android) implements the shared
      # PlatformCapabilities contract; assembleDebug compiles it and testDebugUnitTest
      # runs its JVM tests (file round-trip + bounded shell runner).
      - name: Build platform:android adapter + run its unit tests
        run: ./gradlew :platform:android:assembleDebug :platform:android:testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/androidApp/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumented-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented DB migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: ./gradlew :apps:androidApp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newax.aegis.db.MigrationTest --stacktrace
