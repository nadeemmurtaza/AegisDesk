name: Apple targets CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  apple-compile:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Track M1 + M2: the Apple targets of the shared logic and memory modules
      # compile only on a macOS host. This job is the gate that actually compiles
      # them — the per-target Room KSP (kspIos*/kspMacos*) runs as a dependency of
      # each compile task, and the native actuals (appleMain) are verified against
      # the commonMain expects. Linux CI cannot run these tasks.
      - name: Compile Apple targets
        run: |
          ./gradlew \
            :shared:database:compileKotlinMacosArm64 \
            :shared:database:compileKotlinIosArm64 \
            :shared:database:compileKotlinIosSimulatorArm64 \
            :shared:database:compileCommonMainKotlinMetadata \
            :shared:core:compileKotlinMacosArm64 \
            :shared:platform-api:compileKotlinMacosArm64 \
            :shared:model-api:compileKotlinMacosArm64 \
            :shared:ui:compileKotlinIosArm64 \
            :shared:ui:compileKotlinIosSimulatorArm64 \
            --stacktrace

      # NB shared:ui declares no macosArm64 target, unlike the modules above.
      # Compose Multiplatform ships UI for iOS (native) and JVM Desktop only —
      # there are no macosArm64 Compose artifacts to resolve against. The macOS
      # body is apps/macos, a Compose Desktop app on the JVM target, so it is
      # covered by the Linux invariants job rather than here.
