name: Invariants

# Enforces the AGENTS.md architecture invariants on every push/PR to main:
#   - shared code is platform-free (no platform imports in commonMain)
#   - expect/actual balance (per-target compiles are the authoritative gate)
#   - Android keeps building (RULE 10 / invariant 9)
#
# Two jobs so violations fail in seconds without spinning up the JDK:
#   static-invariants — pure grep checks, no toolchain
#   build-gates       — per-target KMP compiles + Room KSP + Android assembleDebug

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-invariants:
    name: Static invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run invariant checks
        run: bash scripts/check-invariants.sh

  build-gates:
    name: KMP compile gates + Android green
    runs-on: ubuntu-latest
    needs: static-invariants
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile shared:core for every target (expect/actual gate)
        run: ./gradlew :shared:core:compileKotlinJvm :shared:core:assembleDebug --stacktrace

      # desktopJar = jvm("desktop") compile + its Room KSP; assembleDebug = androidTarget
      # compile + its Room KSP. Task naming is compileKotlin<Target>/<target>Jar — NOT
      # compileDesktopKotlin (KGP convention; compileKotlinJvm confirmed for shared:core).
      - name: Compile shared:database per target (expect/actual + Room KSP gate)
        run: ./gradlew :shared:database:desktopJar :shared:database:assembleDebug --stacktrace

      - name: "Build Android app — invariant: Android stays green"
        run: ./gradlew :apps:androidApp:assembleDebug :apps:androidApp:testDebugUnitTest --stacktrace
